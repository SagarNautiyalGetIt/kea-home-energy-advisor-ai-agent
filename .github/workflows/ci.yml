# Automated validation is temporarily paused at the maintainer's request.
# Keep the stable required status so protected PRs do not wait for a missing job.
# This status acknowledges the pause; it does not attest that tests passed.
# Restore the original suite from 12aab63306b9e2694b9afdd4414b95a7ffba3a1a
# when the maintainer resumes CI. Local test sources and commands are retained.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report that automated validation is paused
        run: |
          echo "::notice::CI validation is temporarily paused. No tests, lint, builds or validation jobs ran."
          echo "### CI validation paused" >> "$GITHUB_STEP_SUMMARY"
          echo "No tests, lint, builds or validation jobs ran. Review the PR's local verification before merging." >> "$GITHUB_STEP_SUMMARY"
