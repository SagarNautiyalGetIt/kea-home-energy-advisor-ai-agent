# CI for a five-team monorepo.
#
# Design notes, because the obvious "improvements" here are traps:
#
# 1. NO actions at all — not even `actions/*`. This is stricter than it looks and it
#    is not a preference.
#
#    The original version used `actions/checkout` and `actions/setup-*` on the
#    reasoning that first-party actions "are always allowed". That is true under the
#    common `github_owned_allowed` policy and false under this organisation's, which
#    is set to **`local_only`** — only actions defined inside this repository may run.
#    Every workflow run from 26 August onward failed as `startup_failure` before a
#    single step executed: no logs, no annotation, and a required check that simply
#    never reported. Branch protection requires `check`, so nothing could merge on any
#    branch for two weeks and the cause was invisible from the PR page.
#
#    The policy is set at the ORG level, so it cannot be relaxed from this repository
#    — `PUT /repos/{repo}/actions/permissions` answers 409 "Only 'local_only' actions
#    and workflows are allowed in this organization". Asking the course admins to
#    change it is the other fix; this is the one that does not need anybody.
#
#    So: check out with `git`, and use the toolchains already on the runner image.
#    `ubuntu-latest` ships Python 3.12 and Node 22, which is what the pinned setup
#    actions were selecting anyway. If a step here needs a version the image does not
#    have, install it in a `run:` step — do not reach for an action.
#
# 2. NO path filtering. An earlier version skipped jobs when a PR touched nothing
#    relevant. The backend suite runs in under a second and the frontend build in
#    about ten, so filtering bought nothing and cost a whole class of bug — every
#    filter failure cascades into "skipped" for every job that needs it. Revisit
#    only if CI ever gets genuinely slow.
#
# 3. NO top-level `paths:` key, for the same reason plus a worse one: a workflow
#    skipped that way never reports a status at all, so a required check would
#    block every unrelated PR forever.
#
# 4. The final `check` job is the ONLY one you should mark as required in branch
#    protection. It passes only if everything else passed, so you get one stable
#    gate whose name never changes when jobs are added or renamed. Renaming a
#    required check silently blocks every PR until someone edits the ruleset.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      # Checkout without `actions/checkout` — see the note at the top of this file.
      # `--filter=blob:none` keeps the clone fast while leaving full commit history,
      # which the attribution job genuinely needs: a shallow clone has one commit and
      # would pass the message check every time, and a green check that verifies
      # nothing is worse than no check at all.
      - name: Check out
        working-directory: .
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      # `--clear` because a checkout can already contain a `.venv` path — one was
      # committed as a symlink and broke every run of this job with
      # "[Errno 17] File exists" before a single test ran.
      - run: rm -rf .venv && python3 -m venv .venv && .venv/bin/pip install -q --upgrade pip
      - name: Install Connect audio test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: .venv/bin/pip install -q -e ".[dev]"
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/pytest

  # The frontend generates its types from contracts/openapi.json. If that file
  # drifts from the code, the frontend compiles cleanly against a lie. Cheaper to
  # catch here than as an integration bug three days before the pitch.
  contract:
    name: contract is up to date
    runs-on: ubuntu-latest
    steps:
      # See note 1 at the top: no actions, so checkout is git.
      - name: Check out
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install the API
        working-directory: services/api
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e ".[dev]"
      - name: Regenerate the contract
        working-directory: services/api
        run: |
          .venv/bin/python -c "import json, app.main as m; print(json.dumps(m.app.openapi(), indent=2))" \
            > ../../contracts/openapi.json
      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- contracts/openapi.json; then
            echo "::error::contracts/openapi.json is out of date. Run 'make api-spec' and commit the result."
            exit 1
          fi

  web:
    name: frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      # See note 1 at the top: no actions, so checkout is git.
      - name: Check out
        working-directory: .
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      # `npm ci` not `npm install` — installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is what you want in CI.
      - run: npm ci
      - run: npm run types
      - run: npm run lint
      - run: npm run build

  mobile:
    name: mobile (types + lint + tests + native bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      # Organization policy allows local actions only; use the same git checkout
      # as the other jobs and keep the stable required check name unchanged.
      - name: Check out
        working-directory: .
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      # Bundle checks do not need the native JNI/XCFramework downloads. The
      # phone build helper installs and verifies those explicitly before Gradle.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Export native JavaScript bundles (not a physical phone run)
        run: npx --no-install expo export --platform all --max-workers 2 --output-dir /tmp/kea-mobile-ci-export

  # This repository is assessed as the team's own engineering work. Assistant tooling
  # config, session links and commit trailers are not part of the system and do not
  # belong in the record. See docs/attribution-checklist.md.
  #
  # Scoped to the PR's own commits, not to all history. You are answerable for the
  # commits you wrote; a branch that inherited a trailer from someone else's merge base
  # should not be unmergeable because of it. Pre-existing history is cleaned by the
  # coordinated process in §4 of the checklist, not by blocking unrelated work.
  attribution:
    name: no assistant attribution
    runs-on: ubuntu-latest
    steps:
      # See note 1 at the top: no actions, so checkout is git.
      - name: Check out
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Check tracked files, contents and this branch's commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            ./scripts/check-attribution.sh "$BASE..HEAD"
          else
            ./scripts/check-attribution.sh "HEAD~1..HEAD"
          fi

  # The Data team's pipeline, under data/. Every step is a data/Makefile target, so
  # `make ci` there runs exactly what these three jobs run. None of them reads
  # data/.env: CI holds no Snowflake or kea-db credentials, so dbt is parsed rather
  # than built, and the serving tests get a throwaway Postgres. The real `dbt build`
  # runs in `make deploy`, on the machine that holds the key.
  #
  # Docker comes with the runner image. There is no layer cache (actions/cache is an
  # action, note 1), so the dbt and Airflow images rebuild on every run, which is why
  # their dependencies are pinned. The only network steps are image, pip and dbt-hub
  # pulls.
  data:
    name: data (ruff + unit tests + migrations + story guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      # See note 1 at the top: no actions, so checkout is git.
      - name: Check out
        working-directory: .
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: make ci-lint-test
      # A serving migration already on the base must not change. On a push to main the
      # base is the previous tip of main.
      - run: make ci-migrations BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: make ci-story-guard

  data-dbt:
    name: data (dbt parse + backtest tests + serving publication on Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      # See note 1 at the top: no actions, so checkout is git.
      - name: Check out
        working-directory: .
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: make ci-dbt-parse
      # The 43 kNN leakage tests need numpy, which only the dbt image built by the
      # step above carries; the `data` job's `make test` skips them. This step
      # fails on any skip, so it cannot pass by testing nothing.
      - run: make ci-backtest-tests
      - run: make ci-serving-db

  data-dags:
    name: data (DAG import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      # See note 1 at the top: no actions, so checkout is git.
      - name: Check out
        working-directory: .
        run: |
          git clone --filter=blob:none \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch --filter=blob:none origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: make ci-dags

  # The single required check. Mark THIS one in branch protection and nothing else,
  # then adding or renaming a job above never touches the ruleset.
  check:
    name: check
    needs: [api, contract, web, mobile, attribution, data, data-dbt, data-dags]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "api=${{ needs.api.result }}"
          echo "contract=${{ needs.contract.result }}"
          echo "web=${{ needs.web.result }}"
          echo "mobile=${{ needs.mobile.result }}"
          echo "attribution=${{ needs.attribution.result }}"
          echo "data=${{ needs.data.result }}"
          echo "data-dbt=${{ needs.data-dbt.result }}"
          echo "data-dags=${{ needs.data-dags.result }}"
          if [ "${{ needs.api.result }}" != "success" ] \
          || [ "${{ needs.contract.result }}" != "success" ] \
          || [ "${{ needs.attribution.result }}" != "success" ] \
          || [ "${{ needs.web.result }}" != "success" ] \
          || [ "${{ needs.mobile.result }}" != "success" ] \
          || [ "${{ needs.data.result }}" != "success" ] \
          || [ "${{ needs.data-dbt.result }}" != "success" ] \
          || [ "${{ needs.data-dags.result }}" != "success" ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi
          echo "all green"
