# CI for a five-team monorepo.
#
# Design notes, because the obvious "improvements" here are traps:
#
# 1. NO third-party actions. Only actions/* , which are first-party and always
#    allowed. Many course and enterprise orgs restrict Actions to "GitHub-created
#    and verified" only, and a blocked action fails in about five seconds with an
#    error that does not obviously say "policy". Not worth the debugging tax.
#
# 2. NO path filtering. An earlier version skipped jobs when a PR touched nothing
#    relevant. The backend suite runs in under a second and the frontend build in
#    about ten, so filtering bought nothing and cost a whole class of bug — every
#    filter failure cascades into "skipped" for every job that needs it. Revisit
#    only if CI ever gets genuinely slow.
#
# 3. NO top-level `paths:` key, for the same reason plus a worse one: a workflow
#    skipped that way never reports a status at all, so a required check would
#    block every unrelated PR forever.
#
# 4. The final `check` job is the ONLY one you should mark as required in branch
#    protection. It passes only if everything else passed, so you get one stable
#    gate whose name never changes when jobs are added or renamed. Renaming a
#    required check silently blocks every PR until someone edits the ruleset.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  # The frontend generates its types from contracts/openapi.json. If that file
  # drifts from the code, the frontend compiles cleanly against a lie. Cheaper to
  # catch here than as an integration bug three days before the pitch.
  contract:
    name: contract is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: services/api
      - name: Regenerate the contract
        working-directory: services/api
        run: |
          python -c "import json, app.main as m; print(json.dumps(m.app.openapi(), indent=2))" \
            > ../../contracts/openapi.json
      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- contracts/openapi.json; then
            echo "::error::contracts/openapi.json is out of date. Run 'make api-spec' and commit the result."
            exit 1
          fi

  web:
    name: frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      # `npm ci` not `npm install` — installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is what you want in CI.
      - run: npm ci
      - run: npm run types
      - run: npm run lint
      - run: npm run build

  # This repository is assessed as the team's own engineering work. Assistant tooling
  # config, session links and commit trailers are not part of the system and do not
  # belong in the record. See docs/attribution-checklist.md.
  #
  # Scoped to the PR's own commits, not to all history. You are answerable for the
  # commits you wrote; a branch that inherited a trailer from someone else's merge base
  # should not be unmergeable because of it. Pre-existing history is cleaned by the
  # coordinated process in §4 of the checklist, not by blocking unrelated work.
  attribution:
    name: no assistant attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message half of the check needs real history. The default
          # shallow clone has one commit and would pass every time — a green check
          # that verifies nothing is worse than no check.
          fetch-depth: 0
      - name: Check tracked files, contents and this branch's commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            ./scripts/check-attribution.sh "$BASE..HEAD"
          else
            ./scripts/check-attribution.sh "HEAD~1..HEAD"
          fi

  # The single required check. Mark THIS one in branch protection and nothing else,
  # then adding or renaming a job above never touches the ruleset.
  check:
    name: check
    needs: [api, contract, web, attribution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "api=${{ needs.api.result }}"
          echo "contract=${{ needs.contract.result }}"
          echo "web=${{ needs.web.result }}"
          echo "attribution=${{ needs.attribution.result }}"
          if [ "${{ needs.api.result }}" != "success" ] \
          || [ "${{ needs.contract.result }}" != "success" ] \
          || [ "${{ needs.attribution.result }}" != "success" ] \
          || [ "${{ needs.web.result }}" != "success" ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi
          echo "all green"
