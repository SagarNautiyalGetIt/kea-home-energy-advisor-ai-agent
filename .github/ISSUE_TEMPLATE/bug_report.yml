name: Bug report
description: Something behaves differently from what it should
title: "fix: "
labels: ["type: bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happens
      description: Paste the error or the wrong output. Redact anything sensitive.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Blocks the demo"
        - "Wrong number reaches the customer"
        - "Breaks a teammate's work"
        - "Annoying but survivable"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Machine
      placeholder: "MacBook Pro M4 Pro 48GB / Mac mini / Arch Linux"

  - type: checkboxes
    id: trust
    attributes:
      label: Trust impact
      options:
        - label: This bug could let an unverified figure reach the customer
        - label: This bug affects hardship detection or escalation
