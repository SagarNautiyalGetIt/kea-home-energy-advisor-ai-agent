<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" fill="none">
  <!-- energy-flow-pattern.svg for the midnight dark palette: the same paths, with the warm
       and violet flows turned to cyan and electric blue, a touch stronger to read on navy. -->
