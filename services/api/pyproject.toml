[project]
name = "kea-agent"
version = "0.1.0"
description = "Kea Energy home energy advisor — deterministic analytics, constrained narration, verified output"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Starlette parses multipart bodies through this. Required, not optional: without it
    # `POST /api/bills/analyse` raises at import time rather than at request time, so a
    # deployment missing it fails to start rather than failing one endpoint quietly.
    "python-multipart>=0.0.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
aws = ["boto3>=1.43"]
auth = ["PyJWT[crypto]>=2.10"]
# Only needed when KEA_PROVIDER includes `bedrock`. The provider imports it lazily,
# so a local-only checkout runs the whole test suite without it — and `/health`
# reports model_ready=false rather than raising if it is genuinely missing in a
# deployment that wanted it.
bedrock = [
    "anthropic[bedrock]>=0.40",
]
gcp = [
    "google-genai>=1.0",
]
# Smart-device discovery works without this: `app/homelink/discovery.py` falls back to a
# stdlib one-shot mDNS query, because a demo feature that needs an extra install first is a
# feature that will not be running when it matters. With zeroconf present the scan browses
# continuously and picks up devices that only announce on a slow cycle, which the one-shot
# query misses — so it is worth having and must not be required.
homelink = [
    "zeroconf>=0.132",
]
dev = [
    "boto3>=1.43",
    "PyJWT[crypto]>=2.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by alembic autogenerate - its formatting, not ours.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["app*"]
