name: kea-energy-ec2

x-api: &api
  image: kea-energy-api:ec2
  platform: linux/amd64
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=67108864,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file: /opt/kea/runtime.env
  volumes:
    - /opt/kea/certs/rds:/certs/rds:ro
  environment:
    AWS_REGION: ap-southeast-2
    AWS_DEFAULT_REGION: ap-southeast-2
    AWS_EC2_METADATA_DISABLED: 'true'
    KEA_PROVIDER: bedrock
    # Select the approved Bedrock model through runtime.env or SSM.
    # A Compose override here would prevent the cloud engineer's setting from taking effect.
    KEA_PERSIST: '1'
    KEA_DEMO_LOGINS: '1'
    KEA_GENERATED_DEMO_LOGIN: '1'
    KEA_VOICE_ENABLED: '1'
    KEA_STT_ENGINE: client
    KEA_HOMELINK_DISCOVERY_ENABLED: '0'
    KEA_ALERTS_ENABLED: '0'
  logging:
    driver: local
    options: {max-size: 5m, max-file: '2'}

services:
  api:
    <<: *api
    restart: unless-stopped

  web:
    image: kea-energy-web:ec2
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['443:8080']
    volumes:
      - /opt/kea/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/kea/certs/active:/certs:ro
      # The Android app, published by `make publish-apk`, served at /download/.
      - /opt/kea/downloads:/downloads:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck: {disable: true}
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}

  evaluator:
    <<: *api
    profiles: [jobs]
    command: [python, -m, app.jobs.evaluate_bill_shock]
    restart: 'no'
    healthcheck: {disable: true}

  # The demo walkthrough dashboard, served by Caddy at /metabase/. Its own H2
  # application database lives on the volume; it reads RDS as a read-only login
  # and never sees runtime.env's AWS credentials.
  metabase:
    image: metabase/metabase:v0.63.15
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: ${KEA_CORS_ORIGINS}/metabase/
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
      JAVA_OPTS: -Xmx1g
    volumes:
      - metabase-data:/metabase-data
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}

volumes:
  metabase-data:
